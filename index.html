<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caoli's Bur's - Menú Digital</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            redDark: '#6E0E02',
                            red: '#A01F0B',
                            redLight: '#8B1808',
                            mustard: '#EAA212',
                            mustardDark: '#C78308',
                            honeyCard: '#FFF8E7',
                        }
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-header {
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
    </style>
</head>
<body class="bg-gradient-to-b from-brand-redLight via-brand-red to-brand-redDark text-white font-sans min-h-screen pb-28 antialiased selection:bg-brand-mustard selection:text-black">

    <!-- HEADER / BRANDING -->
    <header class="pt-6 px-4 pb-2 max-w-lg mx-auto">
        <div class="flex items-center gap-3 mb-4">
            <!-- LOGO -->
            <div class="w-16 h-16 rounded-full bg-brand-mustard p-1 shadow-lg shrink-0 flex items-center justify-center border-2 border-white/20">
                <div class="w-full h-full rounded-full bg-brand-red flex flex-col items-center justify-center text-center p-1 border border-brand-mustard/50">
                    <i class="fa-solid font-bold text-brand-mustard text-xs leading-none">CAOLI'S</i>
                    <span class="text-[9px] text-white/90 uppercase tracking-widest mt-0.5">BUR'S</span>
                </div>
            </div>
            <!-- BRAND TITLE -->
            <div>
                <h1 class="text-2xl font-extrabold tracking-tight text-white drop-shadow-sm uppercase">Caoli's Bur's</h1>
                <p class="text-xs text-brand-mustard font-semibold tracking-wide uppercase">SINCE 1998 • SABOR TRADICIONAL</p>
            </div>
        </div>

        <!-- RECURSOS REDUCIDOS / SIN CAJAS BLANCAS PESADAS -->
        <div class="grid grid-cols-2 gap-2 text-xs font-medium mb-3">
            <div class="glass-header rounded-xl p-2.5 flex items-center gap-2 text-white/90">
                <i class="fa-solid fa-motorcycle text-brand-mustard text-sm"></i>
                <span class="truncate">Delivery & Pick-up</span>
            </div>
            <div class="glass-header rounded-xl p-2.5 flex items-center gap-2 text-white/90">
                <i class="fa-solid fa-location-dot text-brand-mustard text-sm"></i>
                <span class="truncate">Maracay, Edo. Aragua</span>
            </div>
        </div>

        <div class="flex items-center justify-between gap-2 text-xs font-medium px-1 text-white/80">
            <a href="https://instagram.com/caolisburs" target="_blank" class="flex items-center gap-1.5 hover:text-brand-mustard transition-colors">
                <i class="fa-brands fa-instagram text-brand-mustard text-sm"></i>
                <span>@caolisburs</span>
            </a>
            <span class="text-white/30">•</span>
            <a href="https://wa.me/584120000000" target="_blank" class="flex items-center gap-1.5 hover:text-brand-mustard transition-colors">
                <i class="fa-brands fa-whatsapp text-brand-mustard text-sm"></i>
                <span>WhatsApp Directo</span>
            </a>
        </div>
    </header>

    <!-- BARRA DE BÚSQUEDA Y NAVEGACIÓN -->
    <section class="sticky top-0 z-20 bg-brand-red/90 backdrop-blur-md pt-2 pb-3 px-4 max-w-lg mx-auto border-b border-white/10 shadow-md">
        <!-- BUSCADOR -->
        <div class="relative mb-3">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
            <input type="text" id="searchInput" oninput="filterProducts()" placeholder="¿Qué se te antoja hoy? Buscar..." class="w-full bg-white text-gray-800 placeholder-gray-400 text-sm rounded-full pl-10 pr-4 py-2.5 outline-none focus:ring-2 focus:ring-brand-mustard transition-all shadow-inner">
        </div>

        <!-- PESTAÑAS DE CATEGORÍAS -->
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1" id="categoryTabs">
            <!-- Renderizado dinámico desde JS -->
        </div>
    </section>

    <!-- CONTENIDO PRINCIPAL: PRODUCTOS POR CATEGORÍA -->
    <main class="px-4 max-w-lg mx-auto pt-4 space-y-8" id="menuContainer">
        <!-- Contenido generado con JavaScript -->
    </main>

    <!-- BANNER FLOTANTE INFERIOR (RESUMEN CARRITO) -->
    <div id="cartBar" class="fixed bottom-0 left-0 right-0 z-30 bg-brand-redDark/95 backdrop-blur-md border-t border-brand-mustard/30 px-4 py-3 shadow-2xl transition-all duration-300">
        <div class="max-w-lg mx-auto flex items-center justify-between gap-3">
            <div>
                <p class="text-[10px] uppercase font-bold tracking-wider text-brand-mustard">Total Estimado</p>
                <div class="flex items-baseline gap-1">
                    <span id="cartTotal" class="text-xl font-extrabold text-white">$0.00</span>
                </div>
                <p class="text-[9px] text-white/70 italic">*Los precios no incluyen delivery</p>
            </div>
            
            <button onclick="openCartModal()" class="bg-gradient-to-r from-brand-mustard to-brand-mustardDark hover:brightness-110 active:scale-95 text-black font-extrabold text-sm px-5 py-2.5 rounded-xl shadow-lg flex items-center gap-2 transition-all">
                <i class="fa-solid fa-cart-shopping text-base"></i>
                <span>Ver Mi Pedido</span>
                <span id="cartBadge" class="bg-black text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold ml-1">0</span>
            </button>
        </div>
    </div>

    <!-- MODAL PERSONALIZACIÓN DE PRODUCTO -->
    <div id="customModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white text-gray-900 w-full max-w-lg rounded-t-3xl sm:rounded-2xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl animate-in slide-in-from-bottom duration-200">
            <div class="bg-brand-red text-white p-4 flex justify-between items-center relative border-b border-brand-mustard/30">
                <div>
                    <h3 id="modalTitle" class="font-bold text-lg leading-tight">Nombre Producto</h3>
                    <p id="modalBasePrice" class="text-xs text-brand-mustard font-semibold"></p>
                </div>
                <button onclick="closeCustomModal()" class="w-8 h-8 rounded-full bg-black/20 text-white flex items-center justify-center hover:bg-black/40 transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="p-4 overflow-y-auto space-y-4 text-sm" id="modalOptionsBody">
                <!-- Opciones dinámicas -->
            </div>

            <div class="p-4 bg-gray-50 border-t flex items-center justify-between gap-3">
                <div class="flex items-center gap-3 bg-gray-200 rounded-lg p-1">
                    <button onclick="adjustModalQty(-1)" class="w-8 h-8 rounded-md bg-white font-bold text-gray-700 shadow flex items-center justify-center active:scale-95">-</button>
                    <span id="modalQty" class="font-bold w-4 text-center">1</span>
                    <button onclick="adjustModalQty(1)" class="w-8 h-8 rounded-md bg-white font-bold text-gray-700 shadow flex items-center justify-center active:scale-95">+</button>
                </div>
                <button onclick="confirmAddCustomProduct()" class="flex-1 bg-brand-mustard hover:bg-brand-mustardDark text-black font-extrabold py-2.5 px-4 rounded-xl shadow transition-all flex items-center justify-center gap-2">
                    <span>Agregar al Pedido</span>
                    <span id="modalTotalPrice" class="text-xs bg-black/10 px-2 py-0.5 rounded">$0.00</span>
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL RESUMEN DE CARRITO -->
    <div id="cartModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white text-gray-900 w-full max-w-lg rounded-t-3xl sm:rounded-2xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl">
            <div class="bg-brand-red text-white p-4 flex justify-between items-center border-b border-brand-mustard/30">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-receipt text-brand-mustard"></i>
                    <h3 class="font-bold text-lg">Resumen de tu Pedido</h3>
                </div>
                <button onclick="closeCartModal()" class="w-8 h-8 rounded-full bg-black/20 text-white flex items-center justify-center hover:bg-black/40 transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="p-4 overflow-y-auto flex-1 space-y-4" id="cartModalBody">
                <!-- Ítems agregados -->
            </div>

            <div class="p-4 bg-gray-50 border-t space-y-3">
                <div class="space-y-1">
                    <div class="flex justify-between items-center font-extrabold text-base text-gray-900">
                        <span>Total Productos:</span>
                        <span id="cartModalTotal" class="text-brand-red">$0.00</span>
                    </div>
                    <p class="text-xs text-gray-500 text-right italic font-medium">*Los precios no incluyen delivery</p>
                </div>

                <div class="space-y-2 pt-2 border-t">
                    <label class="block text-xs font-bold text-gray-700 uppercase">Método de Entrega</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="setDeliveryMethod('Delivery')" id="btnDelivery" class="py-2 text-xs font-bold rounded-lg border-2 border-brand-red bg-brand-red text-white flex items-center justify-center gap-1">
                            <i class="fa-solid fa-motorcycle"></i> Delivery
                        </button>
                        <button onclick="setDeliveryMethod('Retiro')" id="btnPickup" class="py-2 text-xs font-bold rounded-lg border-2 border-gray-200 text-gray-600 flex items-center justify-center gap-1">
                            <i class="fa-solid fa-store"></i> Retiro en Tienda
                        </button>
                    </div>
                </div>

                <button onclick="sendOrderToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3 rounded-xl shadow-lg flex items-center justify-center gap-2 transition-all active:scale-95 text-sm">
                    <i class="fa-brands fa-whatsapp text-lg"></i>
                    <span>Enviar Pedido por WhatsApp</span>
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE DATOS Y LÓGICA -->
    <script>
        const MENU_DATA = [
            {
                id: 'perros',
                name: 'PERROS CALIENTES',
                icon: 'fa-hotdog',
                note: 'Incluyen: lechuga, tomate ensalada, cebolla, papas cabello de ángel y salsas.',
                items: [
                    { id: 'p1', name: 'Clásica', price: 3.5, desc: 'Salchicha tradicional, vegetales y salsas.' },
                    { 
                        id: 'p2', 
                        name: 'Caolis', 
                        price: 4.0, 
                        desc: 'Salchicha + 1 adicional a elegir (Jamón, Queso o Tocineta).',
                        hasOptions: true,
                        optionGroups: [
                            {
                                name: 'Elige 1 Adicional (Obligatorio)',
                                type: 'single',
                                options: [
                                    { name: 'Jamón', price: 0 },
                                    { name: 'Queso', price: 0 },
                                    { name: 'Tocineta', price: 0 }
                                ]
                            }
                        ]
                    },
                    { id: 'p3', name: 'Súper Caolis', price: 5.0, desc: 'Salchicha, Jamón, Queso y Tocineta.' },
                    { id: 'p4', name: 'Especial Caolis', price: 6.0, desc: 'Salchicha, Pollo o Carne, Jamón, Queso y Tocineta.' }
                ]
            },
            {
                id: 'hamburguesas',
                name: 'HAMBURGUESAS',
                icon: 'fa-hamburger',
                note: 'Incluyen: pan suave artesanal, carne/pollo, vegetales frescos, queso y salsas especial de la casa.',
                items: [
                    { id: 'h1', name: 'Súper Caolis Sencilla', price: 6.5, desc: 'Carne o Pollo, queso, vegetales y salsas de la casa.' },
                    { id: 'h2', name: 'Doble Carne / Pollo', price: 8.5, desc: 'Doble proteína a elección, doble queso, tocineta y vegetales.' }
                ]
            }
        ];

        let cart = [];
        let currentCategory = MENU_DATA[0].id;
        let selectedCustomProduct = null;
        let customModalState = { product: null, qty: 1, selectedOptions: {} };
        let deliveryMethod = 'Delivery';

        function init() {
            renderTabs();
            renderMenu();
            updateCartUI();
        }

        function renderTabs() {
            const container = document.getElementById('categoryTabs');
            container.innerHTML = MENU_DATA.map(cat => {
                const isActive = cat.id === currentCategory;
                return `
                    <button onclick="switchCategory('${cat.id}')" class="whitespace-nowrap px-4 py-1.5 rounded-full text-xs font-bold transition-all flex items-center gap-2 ${
                        isActive 
                        ? 'bg-brand-mustard text-black shadow-md scale-105' 
                        : 'bg-black/30 text-white/90 hover:bg-black/50 border border-white/10'
                    }">
                        <i class="fa-solid ${cat.icon}"></i>
                        <span>${cat.name}</span>
                    </button>
                `;
            }).join('');
        }

        function switchCategory(catId) {
            currentCategory = catId;
            renderTabs();
            const el = document.getElementById(`cat-${catId}`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function renderMenu(filterText = '') {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';

            MENU_DATA.forEach(cat => {
                const filteredItems = cat.items.filter(item => 
                    item.name.toLowerCase().includes(filterText.toLowerCase()) ||
                    item.desc.toLowerCase().includes(filterText.toLowerCase())
                );

                if (filteredItems.length === 0) return;

                const section = document.createElement('section');
                section.id = `cat-${cat.id}`;
                section.className = "space-y-3 scroll-mt-28";

                let html = `
                    <div class="inline-block bg-brand-mustard text-black font-extrabold text-sm px-4 py-1 rounded-lg shadow-md uppercase tracking-wide">
                        ${cat.name}
                    </div>
                `;

                if (cat.note) {
                    html += `
                        <div class="glass-header rounded-xl p-2.5 text-xs text-white/90 flex items-start gap-2 border-l-4 border-brand-mustard">
                            <i class="fa-solid fa-circle-info text-brand-mustard text-sm mt-0.5"></i>
                            <p>${cat.note}</p>
                        </div>
                    `;
                }

                html += `<div class="space-y-3">`;
                
                filteredItems.forEach(item => {
                    const cartQty = getCartItemQuantity(item.id);
                    html += `
                        <!-- TARJETA FORMATO MIEL/CREMA INTEGRADA CON BORDE MOSTAZA -->
                        <div class="bg-brand-honeyCard/90 border-2 border-brand-mustard/40 rounded-2xl p-4 text-gray-900 shadow-lg flex justify-between items-center gap-3 transition-transform active:scale-[0.99]">
                            <div class="flex-1">
                                <h4 class="font-bold text-base text-gray-900 leading-tight">${item.name}</h4>
                                <p class="text-xs text-gray-600 mt-1 leading-snug">${item.desc}</p>
                                <span class="inline-block text-base font-extrabold text-brand-red mt-2">$${item.price.toFixed(2)}</span>
                            </div>
                            <div class="shrink-0 flex items-center">
                                ${item.hasOptions ? `
                                    <button onclick="openCustomModal('${item.id}')" class="bg-brand-mustard hover:bg-brand-mustardDark active:scale-95 text-black font-bold text-xs px-3 py-2 rounded-xl shadow flex items-center gap-1">
                                        <span>Personalizar</span>
                                        <i class="fa-solid fa-chevron-right text-[10px]"></i>
                                    </button>
                                ` : `
                                    <div class="flex items-center gap-1.5 bg-white border border-gray-200 rounded-xl p-1 shadow-sm">
                                        <button onclick="updateQuickQty('${item.id}', -1)" class="w-7 h-7 rounded-lg bg-gray-100 text-gray-700 font-bold flex items-center justify-center hover:bg-gray-200 active:scale-90 transition-all">-</button>
                                        <span class="w-5 text-center font-extrabold text-xs text-gray-800">${cartQty}</span>
                                        <button onclick="updateQuickQty('${item.id}', 1)" class="w-7 h-7 rounded-lg bg-brand-mustard text-black font-bold flex items-center justify-center hover:bg-brand-mustardDark active:scale-90 transition-all">+</button>
                                    </div>
                                `}
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;
                section.innerHTML = html;
                container.appendChild(section);
            });
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value;
            renderMenu(query);
        }

        function getCartItemQuantity(productId) {
            return cart
                .filter(item => item.id === productId)
                .reduce((sum, item) => sum + item.qty, 0);
        }

        function updateQuickQty(productId, change) {
            let product = null;
            MENU_DATA.forEach(c => {
                const found = c.items.find(i => i.id === productId);
                if (found) product = found;
            });

            if (!product) return;

            const existingIndex = cart.findIndex(i => i.id === productId && (!i.options || i.options.length === 0));

            if (existingIndex > -1) {
                cart[existingIndex].qty += change;
                if (cart[existingIndex].qty <= 0) {
                    cart.splice(existingIndex, 1);
                }
            } else if (change > 0) {
                cart.push({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    qty: 1,
                    options: []
                });
            }

            updateCartUI();
            renderMenu(document.getElementById('searchInput').value);
        }

        function openCustomModal(productId) {
            let product = null;
            MENU_DATA.forEach(c => {
                const found = c.items.find(i => i.id === productId);
                if (found) product = found;
            });

            if (!product) return;

            customModalState = {
                product: product,
                qty: 1,
                selectedOptions: {}
            };

            // Preseleccionar primeras opciones simples
            if (product.optionGroups) {
                product.optionGroups.forEach((grp, idx) => {
                    if (grp.type === 'single' && grp.options.length > 0) {
                        customModalState.selectedOptions[idx] = grp.options[0];
                    }
                });
            }

            document.getElementById('modalTitle').innerText = product.name;
            document.getElementById('modalBasePrice').innerText = `Precio base: $${product.price.toFixed(2)}`;
            
            renderCustomModalOptions();
            updateModalPrice();

            document.getElementById('customModal').classList.remove('hidden');
        }

        function closeCustomModal() {
            document.getElementById('customModal').classList.add('hidden');
        }

        function renderCustomModalOptions() {
            const container = document.getElementById('modalOptionsBody');
            const grps = customModalState.product.optionGroups || [];

            container.innerHTML = grps.map((grp, gIdx) => `
                <div class="space-y-2">
                    <p class="font-bold text-xs uppercase tracking-wide text-gray-700">${grp.name}</p>
                    <div class="space-y-1.5">
                        ${grp.options.map((opt, oIdx) => {
                            const isSelected = customModalState.selectedOptions[gIdx]?.name === opt.name;
                            return `
                                <label onclick="selectOption(${gIdx}, ${oIdx})" class="flex items-center justify-between p-2.5 rounded-xl border text-xs cursor-pointer transition-all ${
                                    isSelected ? 'border-brand-red bg-red-50 font-bold text-brand-red' : 'border-gray-200 bg-white text-gray-700'
                                }">
                                    <span>${opt.name}</span>
                                    <span>${opt.price > 0 ? `+$${opt.price.toFixed(2)}` : 'Incluido'}</span>
                                </label>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('');

            document.getElementById('modalQty').innerText = customModalState.qty;
        }

        function selectOption(groupIndex, optionIndex) {
            const group = customModalState.product.optionGroups[groupIndex];
            const option = group.options[optionIndex];
            customModalState.selectedOptions[groupIndex] = option;
            renderCustomModalOptions();
            updateModalPrice();
        }

        function adjustModalQty(change) {
            customModalState.qty = Math.max(1, customModalState.qty + change);
            document.getElementById('modalQty').innerText = customModalState.qty;
            updateModalPrice();
        }

        function updateModalPrice() {
            let unitPrice = customModalState.product.price;
            Object.values(customModalState.selectedOptions).forEach(opt => {
                if (opt && opt.price) unitPrice += opt.price;
            });
            const total = unitPrice * customModalState.qty;
            document.getElementById('modalTotalPrice').innerText = `$${total.toFixed(2)}`;
        }

        function confirmAddCustomProduct() {
            const optionsArray = Object.values(customModalState.selectedOptions).map(o => o.name);
            let unitPrice = customModalState.product.price;
            Object.values(customModalState.selectedOptions).forEach(opt => {
                if (opt && opt.price) unitPrice += opt.price;
            });

            cart.push({
                id: customModalState.product.id,
                name: customModalState.product.name,
                price: unitPrice,
                qty: customModalState.qty,
                options: optionsArray
            });

            closeCustomModal();
            updateCartUI();
            renderMenu(document.getElementById('searchInput').value);
        }

        function updateCartUI() {
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            document.getElementById('cartBadge').innerText = totalItems;
            document.getElementById('cartTotal').innerText = `$${totalPrice.toFixed(2)}`;
        }

        function openCartModal() {
            renderCartModalBody();
            document.getElementById('cartModal').classList.remove('hidden');
        }

        function closeCartModal() {
            document.getElementById('cartModal').classList.add('hidden');
        }

        function renderCartModalBody() {
            const container = document.getElementById('cartModalBody');
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('cartModalTotal').innerText = `$${total.toFixed(2)}`;

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-gray-400 space-y-2">
                        <i class="fa-solid fa-basket-shopping text-4xl"></i>
                        <p class="text-xs font-medium">Tu pedido está vacío por ahora.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = cart.map((item, idx) => `
                <div class="flex items-center justify-between gap-3 border-b pb-3 text-xs">
                    <div class="flex-1">
                        <p class="font-bold text-gray-800 text-sm">${item.name}</p>
                        ${item.options && item.options.length > 0 ? `
                            <p class="text-[11px] text-gray-500">+ ${item.options.join(', ')}</p>
                        ` : ''}
                        <p class="font-semibold text-brand-red mt-0.5">$${item.price.toFixed(2)} c/u</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="flex items-center border rounded-lg bg-gray-50">
                            <button onclick="changeCartQty(${idx}, -1)" class="w-6 h-6 font-bold text-gray-600 active:scale-90">-</button>
                            <span class="w-5 text-center font-bold text-gray-800">${item.qty}</span>
                            <button onclick="changeCartQty(${idx}, 1)" class="w-6 h-6 font-bold text-gray-600 active:scale-90">+</button>
                        </div>
                        <button onclick="removeCartItem(${idx})" class="text-gray-400 hover:text-red-500 p-1">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function changeCartQty(index, change) {
            cart[index].qty += change;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            updateCartUI();
            renderCartModalBody();
            renderMenu(document.getElementById('searchInput').value);
        }

        function removeCartItem(index) {
            cart.splice(index, 1);
            updateCartUI();
            renderCartModalBody();
            renderMenu(document.getElementById('searchInput').value);
        }

        function setDeliveryMethod(method) {
            deliveryMethod = method;
            const btnD = document.getElementById('btnDelivery');
            const btnP = document.getElementById('btnPickup');

            if (method === 'Delivery') {
                btnD.className = "py-2 text-xs font-bold rounded-lg border-2 border-brand-red bg-brand-red text-white flex items-center justify-center gap-1";
                btnP.className = "py-2 text-xs font-bold rounded-lg border-2 border-gray-200 text-gray-600 flex items-center justify-center gap-1";
            } else {
                btnP.className = "py-2 text-xs font-bold rounded-lg border-2 border-brand-red bg-brand-red text-white flex items-center justify-center gap-1";
                btnD.className = "py-2 text-xs font-bold rounded-lg border-2 border-gray-200 text-gray-600 flex items-center justify-center gap-1";
            }
        }

        function sendOrderToWhatsApp() {
            if (cart.length === 0) return alert('Por favor agrega productos antes de continuar.');

            let text = `*¡Hola Caoli's Bur's! Quiero realizar un pedido:*\n\n`;
            
            cart.forEach(item => {
                text += `• *${item.qty}x* ${item.name}`;
                if (item.options && item.options.length > 0) {
                    text += ` (${item.options.join(', ')})`;
                }
                text += ` - $${(item.price * item.qty).toFixed(2)}\n`;
            });

            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            text += `\n*TOTAL PRODUCTOS:* $${total.toFixed(2)}`;
            text += `\n*MÉTODO DE ENTREGA:* ${deliveryMethod}`;
            text += `\n\n_Nota: Entiendo que el total no incluye el costo del delivery._`;

            const encoded = encodeURIComponent(text);
            window.open(`https://wa.me/584120000000?text=${encoded}`, '_blank');
        }

        window.onload = init;
    </script>
</body>
</html>
